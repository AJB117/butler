<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1620" />
    <title>Opening Code Server</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #dce7f2;
        background: #0f1620;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
      }

      main {
        display: grid;
        justify-items: center;
        gap: 14px;
        max-width: 430px;
        padding: 32px;
        text-align: center;
      }

      .spinner {
        width: 30px;
        height: 30px;
        border: 2px solid rgba(121, 212, 255, 0.18);
        border-top-color: #79d4ff;
        border-radius: 50%;
        animation: spin 800ms linear infinite;
      }

      h1 {
        margin: 0;
        font-size: 17px;
      }

      p {
        margin: 0;
        color: #8d9aac;
        font-size: 12px;
        line-height: 1.6;
      }

      .error {
        color: #ffabb0;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="spinner" aria-hidden="true"></span>
      <h1>Opening Code Server</h1>
      <p id="status">Waiting for the secure tunnel.</p>
    </main>
    <script type="module" src="/src/editor.ts"></script>
  </body>
</html>
