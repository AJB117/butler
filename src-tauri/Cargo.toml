[package]
name = "butler"
version = "0.1.0"
description = "A desktop manager for remote Open OnDemand Code Server sessions"
authors = ["AJB117"]
edition = "2021"

[lib]
name = "butler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
